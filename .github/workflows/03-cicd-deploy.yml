name: "03 - CI/CD - Build, Docker and Deploy"

on:
  workflow_dispatch:

jobs:

  test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Unit and Integration Tests
        run: mvn clean verify


  docker:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/testbook-api:latest \
            -t ${{ secrets.DOCKER_USERNAME }}/testbook-api:${{ github.sha }} .

      - name: Push Latest Image
        run: |
          docker push \
            ${{ secrets.DOCKER_USERNAME }}/testbook-api:latest

      - name: Push Versioned Image
        run: |
          docker push \
            ${{ secrets.DOCKER_USERNAME }}/testbook-api:${{ github.sha }}


  deploy:
    name: Deploy to EC2
    needs: docker
    runs-on: ubuntu-latest

    steps:
      - name: Deploy application
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/testbook-api:latest

            docker stop testbook-api || true

            docker rm testbook-api || true

            docker run -d \
              --name testbook-api \
              --restart unless-stopped \
              -p 8080:8080 \
              ${{ secrets.DOCKER_USERNAME }}/testbook-api:latest